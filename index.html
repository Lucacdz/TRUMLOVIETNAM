<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚔️ DARK FISH - Soulslike Fishing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            padding: 20px;
        }
        
        .game-wrapper {
            background: #1a1a1a;
            padding: 25px;
            border: 4px solid #3a2a1a;
            box-shadow: 0 0 30px rgba(100, 50, 20, 0.3), inset 0 0 30px rgba(0,0,0,0.8);
            max-width: 750px;
            width: 100%;
            position: relative;
        }
        
        .game-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid #4a3a2a;
            pointer-events: none;
        }
        
        /* Header - Dark Souls Style */
        .header {
            background: #0d0d0d;
            padding: 15px 20px;
            border: 3px solid #2a1a0a;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        
        .stat-block {
            background: #050505;
            padding: 8px 12px;
            border: 2px solid #2a1a0a;
            text-align: center;
            position: relative;
        }
        
        .stat-block::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: #4a3a2a;
            opacity: 0.3;
        }
        
        .stat-label {
            color: #6a5a4a;
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .stat-value {
            color: #c4a060;
            font-size: 16px;
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(196, 160, 96, 0.3);
        }
        
        .stat-value.gold {
            color: #d4a040;
        }
        
        .stat-value.level {
            color: #8a7a6a;
        }
        
        /* Lake Area - Gothic */
        .lake-area {
            background: #0a0a0a;
            padding: 15px;
            border: 3px solid #2a1a0a;
            margin-bottom: 20px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            position: relative;
        }
        
        .lake-area::before {
            content: '✦ DARK WATERS ✦';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a0a;
            padding: 0 15px;
            color: #3a2a1a;
            font-size: 8px;
            letter-spacing: 3px;
            border: 2px solid #2a1a0a;
            border-bottom: none;
        }
        
        .water {
            background: #0a1515;
            height: 220px;
            border: 2px solid #1a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0, 20, 20, 0.8);
        }
        
        /* Pixel ripple effect */
        .water::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(20, 40, 40, 0.1) 4px, rgba(20, 40, 40, 0.1) 5px),
                repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(20, 40, 40, 0.1) 4px, rgba(20, 40, 40, 0.1) 5px);
            pointer-events: none;
        }
        
        .fish-display {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        .fish-emoji {
            font-size: 4rem;
            filter: drop-shadow(0 0 20px rgba(100, 80, 40, 0.3));
            image-rendering: pixelated;
            transition: all 0.3s;
        }
        
        .fish-emoji.fishing {
            animation: pulse 0.5s infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }
        
        .fish-name-label {
            color: #8a7a5a;
            font-size: 12px;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border: 1px solid #2a1a0a;
            display: inline-block;
        }
        
        .fish-rarity {
            font-size: 8px;
            color: #5a4a3a;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        
        /* Action Buttons - Souls Style */
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        
        .btn {
            font-family: 'Press Start 2P', monospace;
            padding: 15px 10px;
            border: 3px solid #2a1a0a;
            background: #0d0d0d;
            color: #8a7a5a;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            letter-spacing: 1px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #3a2a1a;
            pointer-events: none;
        }
        
        .btn:hover:not(:disabled) {
            background: #1a1a1a;
            color: #c4a060;
            border-color: #4a3a2a;
            box-shadow: 0 0 20px rgba(100, 80, 40, 0.1), inset 0 0 20px rgba(100, 80, 40, 0.1);
        }
        
        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .btn-cast {
            border-color: #3a2a1a;
            color: #9a8a6a;
        }
        
        .btn-cast:hover:not(:disabled) {
            border-color: #6a5a3a;
            color: #d4b060;
        }
        
        .btn-sell {
            border-color: #2a1a0a;
            color: #6a5a4a;
        }
        
        .btn-sell:hover:not(:disabled) {
            border-color: #4a3a2a;
            color: #b4a060;
        }
        
        .btn-icon {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        /* Inventory - Dark UI */
        .inventory-area {
            background: #0d0d0d;
            padding: 15px;
            margin-top: 20px;
            border: 3px solid #2a1a0a;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            min-height: 100px;
        }
        
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        
        .inventory-title {
            color: #6a5a4a;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .inventory-count {
            color: #4a3a2a;
            font-size: 8px;
        }
        
        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 50px;
            align-items: flex-start;
        }
        
        .fish-slot {
            background: #0a0a0a;
            border: 2px solid #1a1a1a;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            transition: all 0.2s;
            position: relative;
        }
        
        .fish-slot:hover {
            border-color: #3a2a1a;
            background: #111111;
        }
        
        .fish-slot .emoji {
            font-size: 16px;
        }
        
        .fish-slot .name {
            color: #8a7a5a;
            font-size: 8px;
        }
        
        .fish-slot .count {
            color: #5a4a3a;
            font-size: 8px;
            background: #0a0a0a;
            padding: 0 6px;
            border: 1px solid #1a1a1a;
        }
        
        .empty-inventory {
            color: #3a2a1a;
            font-size: 8px;
            letter-spacing: 2px;
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }
        
        /* Message Log - Dark Souls Death Message Style */
        .message-log {
            background: #0a0a0a;
            padding: 12px 15px;
            margin-top: 12px;
            border: 2px solid #1a1a1a;
            color: #6a5a4a;
            font-size: 8px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            line-height: 1.6;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        
        .message-log .highlight {
            color: #c4a060;
        }
        
        .message-log .danger {
            color: #8a3a2a;
        }
        
        /* Footer */
        .footer {
            margin-top: 15px;
            text-align: right;
            color: #2a1a0a;
            font-size: 6px;
            letter-spacing: 3px;
            border-top: 1px solid #1a1a1a;
            padding-top: 10px;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .game-wrapper { padding: 15px; }
            .header { grid-template-columns: 1fr; gap: 5px; }
            .stat-value { font-size: 12px; }
            .fish-emoji { font-size: 3rem; }
            .action-bar { grid-template-columns: 1fr; }
            .btn { font-size: 8px; padding: 12px; }
        }
        
        /* Bonfire flicker effect */
        @keyframes flicker {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        .bonfire-text {
            color: #4a3a2a;
            animation: flicker 2s infinite;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Header - Dark Souls Stats -->
    <div class="header">
        <div class="stat-block">
            <div class="stat-label">✦ LEVEL</div>
            <div class="stat-value level" id="levelDisplay">1</div>
        </div>
        <div class="stat-block">
            <div class="stat-label">✦ SOULS (EXP)</div>
            <div class="stat-value" id="expDisplay">0 / 30</div>
        </div>
        <div class="stat-block">
            <div class="stat-label">✦ GOLD</div>
            <div class="stat-value gold" id="goldDisplay">0</div>
        </div>
    </div>

    <!-- Dark Lake -->
    <div class="lake-area">
        <div class="water">
            <div class="fish-display">
                <div class="fish-emoji" id="fishEmoji">🐟</div>
                <div class="fish-name-label" id="fishNameLabel">???</div>
                <div class="fish-rarity" id="fishRarity">COMMON</div>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
        <button class="btn btn-cast" id="castBtn">
            <span class="btn-icon">🎣</span>
            CAST LINE
        </button>
        <button class="btn btn-sell" id="sellBtn">
            <span class="btn-icon">💰</span>
            SELL ALL
        </button>
    </div>

    <!-- Inventory -->
    <div class="inventory-area">
        <div class="inventory-header">
            <span class="inventory-title">⬡ INVENTORY</span>
            <span class="inventory-count" id="invCount">0 types</span>
        </div>
        <div class="inventory-grid" id="inventoryContainer">
            <div class="empty-inventory">✦ EMPTY ✦</div>
        </div>
    </div>

    <!-- Message Log -->
    <div class="message-log" id="messageLog">
        <span class="bonfire-text">⚔</span> REST AT BONFIRE <span class="bonfire-text">⚔</span>
    </div>
    
    <div class="footer">⬡ DARK FISH ⬡ PREPARE TO FISH ⬡</div>
</div>

<script>
    (function() {
        // ---------- DARK SOULS FISH DATA ----------
        const FISH_TYPES = [
            { name: 'Hollow Fish', emoji: '🐟', value: 5, exp: 8, rarity: 'COMMON', weight: 30 },
            { name: 'Soul Eel', emoji: '🐍', value: 8, exp: 12, rarity: 'COMMON', weight: 25 },
            { name: 'Dark Trout', emoji: '🐠', value: 12, exp: 18, rarity: 'UNCOMMON', weight: 18 },
            { name: 'Abyss Salmon', emoji: '🍣', value: 20, exp: 25, rarity: 'UNCOMMON', weight: 15 },
            { name: 'Golden Serpent', emoji: '🐉', value: 45, exp: 45, rarity: 'RARE', weight: 7 },
            { name: 'Deep Shark', emoji: '🦈', value: 70, exp: 70, rarity: 'RARE', weight: 4 },
            { name: 'Lord of Cinders', emoji: '⚔️🐟', value: 150, exp: 150, rarity: 'LEGENDARY', weight: 1 },
        ];

        const RARITY_COLORS = {
            'COMMON': '#6a5a4a',
            'UNCOMMON': '#8a8a5a',
            'RARE': '#c4a060',
            'LEGENDARY': '#d4a040'
        };

        function getRandomFish() {
            const totalWeight = FISH_TYPES.reduce((sum, f) => sum + f.weight, 0);
            let rand = Math.random() * totalWeight;
            for (let fish of FISH_TYPES) {
                rand -= fish.weight;
                if (rand <= 0) return { ...fish };
            }
            return { ...FISH_TYPES[0] };
        }

        // ---------- STATE ----------
        let state = {
            level: 1,
            exp: 0,
            gold: 0,
            inventory: [],
            currentFish: null,
            isFishing: false,
            castTimeout: null,
        };

        // DOM
        const dom = {
            level: document.getElementById('levelDisplay'),
            exp: document.getElementById('expDisplay'),
            gold: document.getElementById('goldDisplay'),
            fishEmoji: document.getElementById('fishEmoji'),
            fishName: document.getElementById('fishNameLabel'),
            fishRarity: document.getElementById('fishRarity'),
            invContainer: document.getElementById('inventoryContainer'),
            invCount: document.getElementById('invCount'),
            message: document.getElementById('messageLog'),
            castBtn: document.getElementById('castBtn'),
            sellBtn: document.getElementById('sellBtn'),
        };

        // ---------- CORE FUNCTIONS ----------
        function updateUI() {
            // Stats
            dom.level.textContent = state.level;
            const expNeeded = Math.floor(30 + state.level * 12);
            dom.exp.textContent = `${state.exp} / ${expNeeded}`;
            dom.gold.textContent = state.gold;

            // Fish display
            if (state.currentFish) {
                dom.fishEmoji.textContent = state.currentFish.emoji;
                dom.fishName.textContent = state.currentFish.name;
                dom.fishRarity.textContent = state.currentFish.rarity;
                dom.fishRarity.style.color = RARITY_COLORS[state.currentFish.rarity] || '#6a5a4a';
            } else {
                dom.fishEmoji.textContent = '🐟';
                dom.fishName.textContent = '???';
                dom.fishRarity.textContent = 'UNKNOWN';
                dom.fishRarity.style.color = '#3a2a1a';
            }

            renderInventory();
            checkLevelUp();
        }

        function renderInventory() {
            const container = dom.invContainer;
            if (state.inventory.length === 0) {
                container.innerHTML = '<div class="empty-inventory">✦ EMPTY ✦</div>';
                dom.invCount.textContent = '0 types';
                return;
            }

            const map = new Map();
            state.inventory.forEach(fish => {
                const key = fish.name;
                if (!map.has(key)) {
                    map.set(key, { ...fish, count: 1 });
                } else {
                    map.get(key).count += 1;
                }
            });

            let html = '';
            let totalTypes = 0;
            for (let [name, data] of map.entries()) {
                totalTypes++;
                const rarityColor = RARITY_COLORS[data.rarity] || '#6a5a4a';
                html += `<div class="fish-slot" style="border-color: ${rarityColor}40;">
                            <span class="emoji">${data.emoji}</span>
                            <span class="name" style="color: ${rarityColor};">${name}</span>
                            <span class="count">×${data.count}</span>
                        </div>`;
            }
            container.innerHTML = html;
            dom.invCount.textContent = `${totalTypes} types`;
        }

        function checkLevelUp() {
            const expNeeded = Math.floor(30 + state.level * 12);
            while (state.exp >= expNeeded) {
                state.exp -= expNeeded;
                state.level++;
                setMessage(`⚔ LEVEL UP! ⚔\nYou are now ${state.level}`);
                const newExpNeeded = Math.floor(30 + state.level * 12);
                dom.exp.textContent = `${state.exp} / ${newExpNeeded}`;
            }
        }

        function setMessage(msg) {
            dom.message.innerHTML = msg.replace(/\n/g, '<br>');
        }

        function addExp(amount) {
            const bonus = Math.floor(Math.random() * 5) + 1;
            const totalExp = amount + bonus;
            state.exp += totalExp;
            setMessage(`✦ +${totalExp} SOULS ✦\n(${amount} + ${bonus} bonus)`);
            updateUI();
        }

        function addFishToInventory(fish) {
            state.inventory.push({ ...fish });
            updateUI();
        }

        function sellAllFish() {
            if (state.inventory.length === 0) {
                setMessage('⬡ INVENTORY EMPTY ⬡\nNothing to sell...');
                return;
            }

            let totalGold = 0;
            const totalFish = state.inventory.length;
            state.inventory.forEach(f => totalGold += f.value);

            state.gold += totalGold;
            state.inventory = [];
            setMessage(`💰 SOLD ${totalFish} FISH 💰\nEarned ${totalGold} gold`);
            updateUI();
        }

        // ---------- FISHING MECHANICS ----------
        function startFishing() {
            if (state.isFishing) {
                setMessage('⏳ ALREADY FISHING...\nPatience, undead...');
                return;
            }

            state.isFishing = true;
            dom.castBtn.disabled = true;
            dom.sellBtn.disabled = true;

            dom.fishEmoji.className = 'fish-emoji fishing';
            dom.fishEmoji.textContent = '🎣';
            dom.fishName.textContent = 'WAITING...';
            dom.fishRarity.textContent = '???';
            dom.fishRarity.style.color = '#3a2a1a';
            setMessage('🎣 CASTING LINE...\nThe abyss stirs...');

            const waitTime = 1500 + Math.random() * 2000;

            state.castTimeout = setTimeout(() => {
                const caughtFish = getRandomFish();
                state.currentFish = caughtFish;

                dom.fishEmoji.className = 'fish-emoji';
                dom.fishEmoji.textContent = caughtFish.emoji;
                dom.fishName.textContent = caughtFish.name;
                dom.fishRarity.textContent = caughtFish.rarity;
                dom.fishRarity.style.color = RARITY_COLORS[caughtFish.rarity] || '#6a5a4a';

                addFishToInventory(caughtFish);
                addExp(caughtFish.exp);

                setMessage(`⚔ CAUGHT: ${caughtFish.name} ⚔\nRarity: ${caughtFish.rarity} | Value: ${caughtFish.value} gold`);

                state.isFishing = false;
                dom.castBtn.disabled = false;
                dom.sellBtn.disabled = false;
                updateUI();

            }, waitTime);
        }

        function cancelFishing() {
            if (state.castTimeout) {
                clearTimeout(state.castTimeout);
                state.castTimeout = null;
                state.isFishing = false;
                dom.castBtn.disabled = false;
                dom.sellBtn.disabled = false;
                dom.fishEmoji.className = 'fish-emoji';
                
                if (state.currentFish) {
                    dom.fishEmoji.textContent = state.currentFish.emoji;
                    dom.fishName.textContent = state.currentFish.name;
                    dom.fishRarity.textContent = state.currentFish.rarity;
                    dom.fishRarity.style.color = RARITY_COLORS[state.currentFish.rarity] || '#6a5a4a';
                } else {
                    dom.fishEmoji.textContent = '🐟';
                    dom.fishName.textContent = '???';
                    dom.fishRarity.textContent = 'UNKNOWN';
                    dom.fishRarity.style.color = '#3a2a1a';
                }
                setMessage('⏹ FISHING CANCELLED...\nThe waters grow still...');
            }
        }

        // ---------- EVENT LISTENERS ----------
        dom.castBtn.addEventListener('click', startFishing);

        dom.sellBtn.addEventListener('click', function() {
            if (state.isFishing) cancelFishing();
            sellAllFish();
        });

        // Double click water to cancel fishing
        document.querySelector('.water').addEventListener('dblclick', function() {
            if (state.isFishing) {
                cancelFishing();
                setMessage('⬡ FISHING INTERRUPTED ⬡\nThe darkness recedes...');
            }
        });

        // ---------- INIT ----------
        // Give starter fish
        state.inventory.push({ 
            name: 'Hollow Fish', 
            emoji: '🐟', 
            value: 5, 
            exp: 8, 
            rarity: 'COMMON' 
        });
        state.inventory.push({ 
            name: 'Soul Eel', 
            emoji: '🐍', 
            value: 8, 
            exp: 12, 
            rarity: 'COMMON' 
        });

        state.currentFish = { 
            name: 'Hollow Fish', 
            emoji: '🐟', 
            value: 5, 
            exp: 8, 
            rarity: 'COMMON' 
        };

        updateUI();
        setMessage('⚔ WELCOME, ASHEN ONE ⚔\nCast your line into the abyss...');
    })();
</script>
</body>
</html>
