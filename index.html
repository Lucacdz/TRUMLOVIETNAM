<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎣 RPG Câu Cá</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b3d4f, #1a5f7a);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: #1e3b4a;
            padding: 25px 30px 35px;
            border-radius: 40px 40px 30px 30px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7), inset 0 2px 5px #5f9db2;
            border: 2px solid #7fc1d4;
            max-width: 700px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #17323e;
            padding: 12px 20px;
            border-radius: 60px;
            color: #f0f9ff;
            border-bottom: 3px solid #59a5bd;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stat {
            background: #0b2936;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 2px 4px #05161f;
        }
        .stat span {
            color: #f7d44a;
            margin-right: 4px;
        }
        .lake-area {
            background: #0d3b4b;
            border-radius: 60px 60px 30px 30px;
            padding: 25px 15px 20px;
            border: 3px solid #58a5bb;
            box-shadow: inset 0 -8px 0 #124f62, 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
        }
        .water {
            background: radial-gradient(circle at 30% 40%, #3299b3, #1b677d);
            height: 200px;
            border-radius: 50px 50px 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 10px 20px #43b3d0, 0 0 0 2px #6bbcd2;
            transition: 0.2s;
        }
        .fish-icon {
            font-size: 3.8rem;
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5));
            animation: swim 3s infinite alternate ease-in-out;
            user-select: none;
        }
        @keyframes swim {
            0% { transform: translateX(-20px) scaleX(1); }
            100% { transform: translateX(20px) scaleX(-1); }
        }
        .fish-name {
            background: #06222bcc;
            color: #fff4b0;
            padding: 5px 18px;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            backdrop-filter: blur(3px);
            margin-top: 6px;
            border: 1px solid #b3e2f0;
            font-size: 1.2rem;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 22px;
        }
        .btn {
            background: #f5c542;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1b3d47;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #b57d1e, 0 8px 16px rgba(0,0,0,0.4);
            transition: all 0.07s ease;
            cursor: pointer;
            border: 1px solid #ffe28b;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b57d1e;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a5b1b;
            pointer-events: none;
        }
        .btn-secondary {
            background: #57b7cf;
            box-shadow: 0 6px 0 #2d768a;
            border-color: #8ed7ec;
            color: #05222b;
        }
        .btn-secondary:active {
            box-shadow: 0 1px 0 #2d768a;
        }
        .inventory-area {
            background: #15323e;
            border-radius: 40px;
            padding: 15px 18px;
            margin-top: 20px;
            border: 2px solid #439eb6;
            color: #ecf9ff;
        }
        .inventory-title {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #b3e6f5;
            padding-bottom: 6px;
            border-bottom: 1px dashed #3b7f92;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .inventory-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            min-height: 40px;
            align-items: center;
        }
        .fish-badge {
            background: #1e4b5a;
            padding: 5px 16px 5px 12px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            border: 1px solid #78bccf;
            box-shadow: inset 0 1px 5px #10505f;
        }
        .fish-badge span {
            background: #2d6e80;
            padding: 0 10px;
            border-radius: 30px;
            color: #fae16b;
            font-weight: bold;
        }
        .empty-inv {
            opacity: 0.7;
            font-style: italic;
            color: #a2cfde;
        }
        .message-log {
            background: #09242e;
            padding: 8px 16px;
            border-radius: 60px;
            margin: 15px 0 5px;
            color: #d5edf5;
            text-align: center;
            font-weight: 500;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #398194;
            font-size: 1rem;
        }
        .footer {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
            color: #68adc0;
            font-size: 0.85rem;
            padding-right: 8px;
        }
        @media (max-width: 500px) {
            .game-container { padding: 15px; }
            .stat { font-size: 0.9rem; padding: 4px 12px; }
            .btn { padding: 10px 16px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Thanh trạng thái RPG -->
    <div class="header">
        <div class="stat">🎣 <span id="levelDisplay">1</span></div>
        <div class="stat">⭐ EXP <span id="expDisplay">0</span>/<span id="expNext">30</span></div>
        <div class="stat">💰 <span id="goldDisplay">0</span></div>
    </div>

    <!-- Khu vực hồ câu -->
    <div class="lake-area">
        <div class="water" id="waterArea">
            <div class="fish-icon" id="fishEmoji">🐟</div>
            <div class="fish-name" id="fishNameLabel">Cá chép</div>
        </div>
    </div>

    <!-- Nút hành động -->
    <div class="action-bar">
        <button class="btn" id="castBtn">🎣 Thả câu</button>
        <button class="btn btn-secondary" id="sellBtn">💰 Bán cá</button>
    </div>

    <!-- Kho đồ -->
    <div class="inventory-area">
        <div class="inventory-title">
            <span>🎒 Kho cá</span>
            <span id="invCount">0 loại</span>
        </div>
        <div class="inventory-list" id="inventoryContainer">
            <span class="empty-inv">✨ Chưa có con cá nào</span>
        </div>
    </div>

    <!-- Message log -->
    <div class="message-log" id="messageLog">🐠 Chào mừng! Hãy thả câu nào!</div>
    <div class="footer">⚡ RPG Câu cá · Click thả câu</div>
</div>

<script>
    (function() {
        // ---------- DỮ LIỆU CÁ ----------
        const FISH_TYPES = [
            { name: 'Cá chép', emoji: '🐟', value: 5, exp: 8, weight: 30 },
            { name: 'Cá rô', emoji: '🐠', value: 8, exp: 12, weight: 25 },
            { name: 'Cá trê', emoji: '🐡', value: 12, exp: 18, weight: 18 },
            { name: 'Cá hồi', emoji: '🍣', value: 20, exp: 25, weight: 15 },
            { name: 'Cá vàng', emoji: '🐉', value: 45, exp: 45, weight: 7 },
            { name: 'Cá mập con', emoji: '🦈', value: 70, exp: 70, weight: 4 },
            { name: 'Cá kiếm', emoji: '⚔️🐟', value: 120, exp: 110, weight: 1 },
        ];

        // Hàm chọn cá dựa trên trọng số
        function getRandomFish() {
            const totalWeight = FISH_TYPES.reduce((sum, f) => sum + f.weight, 0);
            let rand = Math.random() * totalWeight;
            for (let fish of FISH_TYPES) {
                rand -= fish.weight;
                if (rand <= 0) return { ...fish };
            }
            return { ...FISH_TYPES[0] };
        }

        // ---------- STATE ----------
        let state = {
            level: 1,
            exp: 0,
            gold: 0,
            inventory: [], // [{name, emoji, value, exp}]
            currentFish: null, // cá đang hiển thị trên hồ
            isFishing: false,
            castTimeout: null,
        };

        // DOM refs
        const dom = {
            level: document.getElementById('levelDisplay'),
            exp: document.getElementById('expDisplay'),
            expNext: document.getElementById('expNext'),
            gold: document.getElementById('goldDisplay'),
            fishEmoji: document.getElementById('fishEmoji'),
            fishName: document.getElementById('fishNameLabel'),
            water: document.getElementById('waterArea'),
            invContainer: document.getElementById('inventoryContainer'),
            invCount: document.getElementById('invCount'),
            message: document.getElementById('messageLog'),
            castBtn: document.getElementById('castBtn'),
            sellBtn: document.getElementById('sellBtn'),
        };

        // ---------- HÀM CỐT LÕI ----------
        function updateUI() {
            // Level & EXP
            dom.level.textContent = state.level;
            const expNeeded = Math.floor(30 + state.level * 12);
            dom.exp.textContent = state.exp;
            dom.expNext.textContent = expNeeded;
            dom.gold.textContent = state.gold;

            // Hiển thị cá hiện tại (nếu có)
            if (state.currentFish) {
                dom.fishEmoji.textContent = state.currentFish.emoji;
                dom.fishName.textContent = state.currentFish.name;
            } else {
                dom.fishEmoji.textContent = '🐟';
                dom.fishName.textContent = 'Chưa câu';
            }

            // Inventory
            renderInventory();

            // Check level up
            checkLevelUp();
        }

        function renderInventory() {
            const container = dom.invContainer;
            if (state.inventory.length === 0) {
                container.innerHTML = '<span class="empty-inv">✨ Chưa có con cá nào</span>';
                dom.invCount.textContent = '0 loại';
                return;
            }

            // Nhóm theo tên + đếm số lượng
            const map = new Map();
            state.inventory.forEach(fish => {
                const key = fish.name;
                if (!map.has(key)) {
                    map.set(key, { ...fish, count: 1 });
                } else {
                    map.get(key).count += 1;
                }
            });

            let html = '';
            let totalTypes = 0;
            for (let [name, data] of map.entries()) {
                totalTypes++;
                html += `<div class="fish-badge">
                            ${data.emoji} ${name} 
                            <span>×${data.count}</span>
                        </div>`;
            }
            container.innerHTML = html;
            dom.invCount.textContent = totalTypes + ' loại';
        }

        function checkLevelUp() {
            const expNeeded = Math.floor(30 + state.level * 12);
            while (state.exp >= expNeeded) {
                state.exp -= expNeeded;
                state.level++;
                setMessage(`🎉 LEVEL UP! Bạn đạt cấp ${state.level}!`);
                // Cập nhật lại expNeeded cho lần tiếp theo
                const newExpNeeded = Math.floor(30 + state.level * 12);
                dom.expNext.textContent = newExpNeeded;
            }
        }

        function setMessage(msg) {
            dom.message.textContent = msg;
        }

        // Thêm kinh nghiệm (có bonus ngẫu nhiên)
        function addExp(amount) {
            const bonus = Math.floor(Math.random() * 3) + 1; // 1-3 bonus
            const totalExp = amount + bonus;
            state.exp += totalExp;
            setMessage(`✨ +${totalExp} EXP (bao gồm +${bonus} bonus)`);
            updateUI();
        }

        // Thêm cá vào kho
        function addFishToInventory(fish) {
            state.inventory.push({ ...fish });
            updateUI();
        }

        // Bán toàn bộ cá
        function sellAllFish() {
            if (state.inventory.length === 0) {
                setMessage('❌ Kho trống! Không có gì để bán.');
                return;
            }

            let totalGold = 0;
            let totalFish = state.inventory.length;
            // Tính tổng giá trị
            state.inventory.forEach(f => totalGold += f.value);

            // Cộng vàng
            state.gold += totalGold;
            // Xóa kho
            state.inventory = [];
            setMessage(`💰 Bán thành công ${totalFish} con cá, nhận được ${totalGold} vàng!`);
            updateUI();
        }

        // ---- HÀNH ĐỘNG CÂU CÁ ----
        function startFishing() {
            if (state.isFishing) {
                setMessage('⏳ Đang câu, hãy kiên nhẫn!');
                return;
            }

            state.isFishing = true;
            dom.castBtn.disabled = true;
            dom.sellBtn.disabled = true;

            // Hiệu ứng: con cá biến mất, hiện dấu ...
            dom.fishEmoji.textContent = '🎣';
            dom.fishName.textContent = 'Đang câu...';
            setMessage('⏳ Thả câu... chờ cá cắn câu!');

            // Thời gian chờ ngẫu nhiên 1.2s ~ 2.5s
            const waitTime = 1200 + Math.random() * 1300; 

            state.castTimeout = setTimeout(() => {
                // Chọn cá ngẫu nhiên
                const caughtFish = getRandomFish();
                state.currentFish = caughtFish;

                // Cập nhật giao diện cá
                dom.fishEmoji.textContent = caughtFish.emoji;
                dom.fishName.textContent = caughtFish.name;

                // Thêm vào kho
                addFishToInventory(caughtFish);

                // Cộng EXP
                addExp(caughtFish.exp);

                // Thông báo
                setMessage(`🎣 Bắt được ${caughtFish.name}! +${caughtFish.value} vàng (nếu bán)`);

                // Reset trạng thái câu
                state.isFishing = false;
                dom.castBtn.disabled = false;
                dom.sellBtn.disabled = false;

                // Cập nhật UI (đã có trong addFishToInventory)
                updateUI();

            }, waitTime);
        }

        // Hủy câu nếu đang chờ
        function cancelFishingIfNeeded() {
            if (state.castTimeout) {
                clearTimeout(state.castTimeout);
                state.castTimeout = null;
                state.isFishing = false;
                dom.castBtn.disabled = false;
                dom.sellBtn.disabled = false;
                // Khôi phục cá cũ hoặc mặc định
                if (state.currentFish) {
                    dom.fishEmoji.textContent = state.currentFish.emoji;
                    dom.fishName.textContent = state.currentFish.name;
                } else {
                    dom.fishEmoji.textContent = '🐟';
                    dom.fishName.textContent = 'Chưa câu';
                }
                setMessage('⏹ Đã hủy câu.');
            }
        }

        // ---------- KHỞI TẠO SỰ KIỆN ----------
        dom.castBtn.addEventListener('click', function(e) {
            e.preventDefault();
            startFishing();
        });

        dom.sellBtn.addEventListener('click', function(e) {
            e.preventDefault();
            // Nếu đang câu, hủy câu trước
            if (state.isFishing) {
                cancelFishingIfNeeded();
            }
            sellAllFish();
        });

        // Xử lý nếu người dùng click nhanh khi đang câu (hủy câu)
        // Nhưng bấm "Thả câu" lần nữa sẽ chỉ hiện thông báo đang câu.
        // Nếu muốn hủy câu, click vào nút bán hoặc ... (tính năng ẩn: click đúp vào hồ)
        dom.water.addEventListener('dblclick', function() {
            if (state.isFishing) {
                cancelFishingIfNeeded();
                setMessage('🔄 Đã hủy câu (double-click)');
            }
        });

        // ---------- KHỞI CHẠY ----------
        // Tạo 1 con cá mặc định cho vui
        state.currentFish = { name: 'Cá chép', emoji: '🐟', value: 5, exp: 8 };
        updateUI();
        setMessage('🐠 Chào mừng! Bắt cá để lên cấp và kiếm vàng!');

        // Cho người chơi vài con cá ban đầu (tùy thích)
        // Ví dụ khởi tạo 1 con cá chép:
        state.inventory.push({ name: 'Cá chép', emoji: '🐟', value: 5, exp: 8 });
        state.inventory.push({ name: 'Cá rô', emoji: '🐠', value: 8, exp: 12 });
        updateUI();
        setMessage('🎁 Bạn nhận được 2 con cá khởi nghiệp!');
    })();
</script>
</body>
</html>
